<!-- =========================================================================
     視覺化小島名稱與內容編輯器 (可即時預覽 + 一鍵匯出 data.json)
     ========================================================================= -->
<button id="toggle-editor-btn"
    class="fixed bottom-5 right-5 z-40 px-4 py-2.5 rounded-full bg-gradient-to-r from-indigo-600 to-cyan-600 text-white font-bold text-sm shadow-lg hover:scale-105 active:scale-95 transition flex items-center gap-2 cursor-pointer">
    <span>✏️ 編輯小島內容</span>
</button>

<div id="island-editor-drawer"
    class="fixed top-0 right-0 h-full w-full max-w-md z-50 glass-panel shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col border-l border-slate-300/60">
    
    <!-- 頂部標題列 -->
    <div class="p-4 border-b border-slate-300/50 flex items-center justify-between">
        <div>
            <h3 class="font-bold text-lg flex items-center gap-2">🏝️ 小島內容輕鬆編輯器</h3>
            <p class="text-xs opacity-75">修改後點擊「套用並即時預覽」即可看到結果</p>
        </div>
        <button id="close-editor-btn" class="w-8 h-8 rounded-full hover:bg-slate-500/20 flex items-center justify-center font-bold cursor-pointer">✕</button>
    </div>

    <!-- 島嶼選擇分頁 -->
    <div class="p-3 border-b border-slate-300/40 bg-slate-500/5">
        <label class="block text-xs font-bold mb-1.5 opacity-80">選擇要編輯的島嶼：</label>
        <select id="editor-island-select" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white/90 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="hub">🏛️ 中央主島</option>
            <option value="island_1">🟢 衛星島 1 (90°)</option>
            <option value="island_2">🟡 衛星島 2 (30°)</option>
            <option value="island_3">🔵 衛星島 3 (-30°)</option>
            <option value="island_4">🟣 衛星島 4 (-90°)</option>
            <option value="island_5">🟠 衛星島 5 (-150°)</option>
            <option value="island_6">🔴 衛星島 6 (150°)</option>
        </select>
    </div>

    <!-- 表單內容區 (可滾動) -->
    <div class="p-4 overflow-y-auto flex-1 space-y-4 text-sm">
        
        <!-- 基本名稱與標籤 -->
        <div class="space-y-3 p-3 rounded-xl bg-slate-500/5 border border-slate-400/20">
            <div class="font-bold text-xs uppercase tracking-wider opacity-70">基本資訊</div>
            <div>
                <label class="block text-xs font-semibold mb-1">小島名稱</label>
                <input id="ed-name" type="text" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white/95 text-slate-800" placeholder="例如：七賢大樓">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold mb-1">英文副標題</label>
                    <input id="ed-en-name" type="text" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white/95 text-slate-800" placeholder="CENTRAL HUB">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">徽章標籤</label>
                    <input id="ed-badge" type="text" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white/95 text-slate-800" placeholder="核心中樞">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">小島簡介摘要</label>
                <textarea id="ed-summary" rows="3" class="w-full px-3 py-1.5 rounded-lg border border-slate-300 bg-white/95 text-slate-800" placeholder="輸入該島嶼的核心說明..."></textarea>
            </div>
        </div>

        <!-- 關鍵指標 (3組) -->
        <div class="space-y-2 p-3 rounded-xl bg-slate-500/5 border border-slate-400/20">
            <div class="font-bold text-xs uppercase tracking-wider opacity-70">關鍵數據指標 (3 項)</div>
            <div id="ed-metrics-container" class="space-y-2"></div>
        </div>

        <!-- 詳細介紹段落 -->
        <div class="space-y-2 p-3 rounded-xl bg-slate-500/5 border border-slate-400/20">
            <div class="flex items-center justify-between">
                <span class="font-bold text-xs uppercase tracking-wider opacity-70">詳細介紹段落</span>
                <button id="ed-add-section-btn" type="button" class="text-xs px-2 py-1 rounded bg-blue-600 text-white hover:bg-blue-700 cursor-pointer">+ 新增段落</button>
            </div>
            <div id="ed-sections-container" class="space-y-3"></div>
        </div>
    </div>

    <!-- 底部操作按鈕列 -->
    <div class="p-4 border-t border-slate-300/50 space-y-2 bg-slate-500/5">
        <button id="ed-apply-btn" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow transition cursor-pointer">
            ✅ 套用變更並即時預覽
        </button>
        <div class="grid grid-cols-2 gap-2">
            <button id="ed-download-btn" class="py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow transition cursor-pointer">
                ⬇ 下載最新 data.json
            </button>
            <button id="ed-reset-btn" class="py-2 px-3 rounded-xl bg-slate-500/20 hover:bg-slate-500/30 font-semibold text-xs transition cursor-pointer">
                ↺ 還原預設值
            </button>
        </div>
    </div>
</div>

<script>
(function initIslandEasyEditor() {
    const STORAGE_KEY = 'island_3d_custom_data_v1';
    const drawer = document.getElementById('island-editor-drawer');
    const selectEl = document.getElementById('editor-island-select');
    
    // 1. 取得目前網站資料 (優先讀取 localStorage -> window.siteData -> embedded-data-json)
    function getSiteData() {
        if (window.siteData) return window.siteData;
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                window.siteData = JSON.parse(saved);
                return window.siteData;
            } catch (e) {}
        }
        const embeddedEl = document.getElementById('embedded-data-json');
        if (embeddedEl) {
            window.siteData = JSON.parse(embeddedEl.textContent);
            return window.siteData;
        }
        return null;
    }

    // 2. 取得選中的島嶼物件
    function getTargetIsland(data, id) {
        if (!data) return null;
        if (id === 'hub' || (data.centerIsland && data.centerIsland.id === id)) {
            return data.centerIsland;
        }
        return (data.satelliteIslands || []).find(item => item.id === id);
    }

    // 3. 更新下拉選單顯示名稱
    function refreshDropdownLabels(data) {
        if (!data) return;
        const opts = selectEl.options;
        if (data.centerIsland) {
            opts[0].textContent = `🏛️ 中央主島：${data.centerIsland.name}`;
        }
        (data.satelliteIslands || []).forEach((isl, idx) => {
            if (opts[idx + 1]) {
                opts[idx + 1].value = isl.id;
                opts[idx + 1].textContent = `🏝️ 衛星島 ${idx + 1}：${isl.name}`;
            }
        });
    }

    // 4. 將島嶼資料填入表單
    function loadIslandToForm(islandId) {
        const data = getSiteData();
        const isl = getTargetIsland(data, islandId);
        if (!isl) return;

        document.getElementById('ed-name').value = isl.name || '';
        document.getElementById('ed-en-name').value = isl.englishName || '';
        document.getElementById('ed-badge').value = isl.badge || '';
        document.getElementById('ed-summary').value = isl.summary || '';

        // 渲染指標欄位
        const metricsBox = document.getElementById('ed-metrics-container');
        metricsBox.innerHTML = '';
        const metrics = isl.metrics && isl.metrics.length ? isl.metrics : [
            { label: '指標一', value: '-' },
            { label: '指標二', value: '-' },
            { label: '指標三', value: '-' }
        ];
        metrics.forEach((m, i) => {
            metricsBox.innerHTML += `
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" data-m-label="${i}" value="${m.label || ''}" placeholder="指標名稱" class="px-2.5 py-1 rounded border border-slate-300 bg-white/95 text-slate-800 text-xs">
                    <input type="text" data-m-value="${i}" value="${m.value || ''}" placeholder="數值" class="px-2.5 py-1 rounded border border-slate-300 bg-white/95 text-slate-800 text-xs font-bold">
                </div>
            `;
        });

        // 渲染段落欄位
        renderSectionsForm(isl.sections || []);
    }

    function renderSectionsForm(sections) {
        const secBox = document.getElementById('ed-sections-container');
        secBox.innerHTML = '';
        sections.forEach((sec, idx) => {
            const div = document.createElement('div');
            div.className = 'p-2.5 rounded-lg border border-slate-300/80 bg-white/60 space-y-1.5 relative';
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500">段落 #${idx + 1}</span>
                    <button type="button" class="text-xs text-red-500 hover:underline remove-sec-btn cursor-pointer" data-idx="${idx}">刪除</button>
                </div>
                <input type="text" data-sec-title="${idx}" value="${sec.title || ''}" placeholder="段落標題" class="w-full px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-800 text-xs font-bold">
                <textarea rows="2" data-sec-content="${idx}" placeholder="段落詳細內容" class="w-full px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-800 text-xs">${sec.content || ''}</textarea>
            `;
            secBox.appendChild(div);
        });

        secBox.querySelectorAll('.remove-sec-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const currentSections = collectSectionsFromForm();
                currentSections.splice(Number(btn.dataset.idx), 1);
                renderSectionsForm(currentSections);
            });
        });
    }

    function collectSectionsFromForm() {
        const titles = document.querySelectorAll('[data-sec-title]');
